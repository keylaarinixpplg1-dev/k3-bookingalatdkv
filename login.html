<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DKV Tools — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-body">

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="img/logo.png" alt="Logo Sekolah" class="school-logo" style="width:44px;height:44px;">
      <div class="logo-text" style="text-align:left;">
        <span class="brand">DKV Tools</span>
        <span class="school">SMK Brantas Karangkates</span>
      </div>
    </div>
    <h1 class="auth-title">Masuk ke Akun</h1>
    <p class="auth-sub">Pilih peran, lalu masuk untuk mulai meminjam alat DKV.</p>

    <!-- TAB ROLE -->
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-role="siswa">👨‍🎓 Siswa</button>
      <button type="button" class="auth-tab" data-role="admin">🛠️ Admin</button>
    </div>

    <!-- FORM LOGIN -->
    <form id="loginForm" class="auth-form" autocomplete="off">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" id="loginUser" placeholder="Masukkan username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" id="loginPass" placeholder="Masukkan password" required>
      </div>
      <p class="auth-error" id="loginError"></p>
      <button type="submit" class="btn btn-primary auth-submit">Masuk</button>
    </form>

    <!-- HINT AKUN DEMO -->
    <div class="auth-hint">
      <p><b>Demo akun:</b></p>
      <p>👨‍🎓 Siswa — <code>siswa</code> / <code>siswa123</code></p>
      <p>🛠️ Admin — <code>admin</code> / <code>admin123</code></p>
    </div>
  </div>
</div>

<script src="js/login.js"></script>
<script>
  // 1. Cek jika user sudah login (mencegah buka halaman login berulang)
  const s = getSession();
  if (s) {
    if (s.role === 'admin') location.replace('admin.html');
    else if (!s.profilLengkap) location.replace('profil.html');
    else location.replace('index.html');
  }

  // 2. Logika Pindah Tab
  let currentRole = 'siswa';
  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentRole = tab.dataset.role;
      document.getElementById('loginError').textContent = ''; // Reset error
    });
  });

  // 3. Logika Submit Form
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;
    const err  = document.getElementById('loginError');
    
    // Panggil fungsi doLogin dari js/login.js
    const res = doLogin(user, pass, currentRole);
    
    if (!res.ok) { 
      err.textContent = res.message; // Tampilkan error bahasa Indonesia
      return; 
    }
    
    err.textContent = '';
    
    // Redirect berdasarkan role setelah login sukses
    if (currentRole === 'admin') {
      location.replace('admin.html');
    } else {
      const sess = getSession();
      if (!sess.profilLengkap) location.replace('profil.html'); // Siswa wajib isi profil
      else location.replace('index.html');
    }
  });
</script>
</body>
</html>
